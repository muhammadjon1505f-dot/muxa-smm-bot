services:
  - type: web
    name: muxa-smm-bot
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        value: "8191930658"
      - key: WEBAPP_URL
        value: "https://muhammadjon1505f-dot.github.io/smm-webapp/"
      - key: PORT
        value: "10000"
